# Layer-by-layer data provenance.
#
# This is the single truth table for "where does this number come from?".
# config/sources.yaml remains the source registry (terms, lanes, capabilities,
# URLs); this file says which source owns which layer. A source is never
# described as primary for a layer it does not actually supply.

version: 1

layers:
  - id: league_results_current
    label: League results, current season
    kind: provider
    primary: football_data_uk
    fallback: [api_football]
    status: active
    scope: current season, all four SPFL tiers
    fields: [fixtures, results, status]
    gate: config/league_migration.yaml
    surfaces: [/sources/, /methodology/, /scotland/]
    note: >
      Football-Data is primary for results and team match stats. API-Football
      is the fallback for a current-season result football-data has not
      published yet; it fills every SPFL tier, while the official SPFL club
      feed still wins for Aberdeen. The provider result is never used to
      override an existing football-data score: a disagreement is recorded.
      API-Football does not currently supply all-tier team match stats, so the
      result fallback is kept separate from the stats source.

  - id: league_results_history
    label: League results, historical
    kind: provider
    primary: football_data_uk
    fallback: []
    status: active
    scope: 2013-14 to the season before the current one
    fields: [fixtures, results]
    surfaces: [/sources/, /history/]
    note: Historical league results and the compact pre-2019 baseline.

  - id: league_team_stats
    label: League team match stats
    kind: provider
    primary: football_data_uk
    fallback: []
    status: active
    scope: 2013-14 to current
    fields: [shots, shots_on_target, corners, fouls, cards]
    surfaces: [/sources/, /themes/, /scotland/]
    note: >
      Shots, corners, fouls and cards for the style/theme proxies. API-Football
      team statistics are not available for every SPFL tier.

  - id: league_standings
    label: League tables
    kind: computed
    primary: computed
    fallback: []
    status: active
    scope: current and historical seasons
    fields: [points, goal_difference, position, form]
    surfaces: [/scotland/]
    note: Computed from league results with split and deduction rules.

  - id: cup_fixtures
    label: League Cup and Scottish Cup fixtures
    kind: provider
    primary: api_football
    fallback: []
    status: partial
    scope: current season
    fields: [fixtures, results, rounds, penalties]
    surfaces: [/competitions/, /sources/]
    note: >
      League Cup is complete; Scottish Cup is 50 of 136 ties at the key-test.
      Missing rounds are labelled.

  - id: club_fixtures
    label: Aberdeen club fixture list
    kind: provider
    primary: spfl
    fallback: [api_football]
    status: active
    scope: current season
    fields: [fixtures, results, kickoff, status, venue]
    surfaces: [/fixtures/, /matchday/, /matches/, /analysis/]
    note: >
      The SPFL club feed supplies the short horizon; the normalized API-Football
      season schedule supplies the remaining fixtures. Rows are merged and
      conflicts are labelled; /matches/ keeps the played record plus scheduled
      rows without pages.

  - id: lineups_roles
    label: Lineups, formations and starting roles
    kind: provider
    primary: api_football
    fallback: []
    status: active
    scope: Aberdeen fixtures, current season
    fields: [formation, starting_xi, grid, events, minutes]
    surfaces: [/squad/, /matchday/, /themes/]
    note: Roles are derived from the starting-XI grid, never from position labels.

  - id: player_match_stats
    label: Player match ratings and stats
    kind: provider
    primary: api_football
    fallback: []
    status: partial
    scope: Premiership, current season
    fields: [rating, goals, assists, cards, minutes]
    surfaces: [/themes/, /squad/, /matchday/]
    note: >
      Premiership coverage; lower-tier current-season player stats were empty
      at the key-test. Historical player-match-stat files are empty.
  - id: player_squads
    label: Named matchday squads
    kind: provider
    primary: api_football
    fallback: []
    status: partial
    scope: Aberdeen competitive fixtures, current season
    fields: [starters, used substitutes, unused substitutes, bench completeness]
    surfaces: [/analysis/, /sources/]
    note: >
      Every starter and named substitute from the cached lineup response,
      including unused substitutes. Bench completeness is published per side
      and gates omission inference; a missing bench is unknown, not empty.

  - id: scouting_team_context
    label: Scouting league tables for team context
    kind: provider
    primary: api_football
    fallback: []
    status: partial
    scope: current table for every enabled scouting league
    fields: [rank, points, played, goal_difference, ppg, group]
    surfaces: [/scouting/, /scouting/search/, /scouting/player/, /sources/, /methodology/]
    note: >
      One standings request per enabled league. The group with the most played
      rounds is used; a league without a table is unknown, never
      zero-strength. The team points percentile is within the league only.

  - id: scouting_current_clubs
    label: Current club resolution for the scouting pool
    kind: provider
    primary: api_football
    fallback: []
    status: partial
    scope: transfer feed for every team represented in the scouting pool
    fields: [player, transfer_date, transfer_type, current_team]
    surfaces: [/scouting/, /scouting/search/, /scouting/player/, /sources/]
    note: >
      The stats row names the club where the season statistics were produced.
      The current club comes from the latest recorded transfer on or before the
      snapshot date. A player with no later transfer keeps the stats club with
      source stats_snapshot. A subsequent move that does not involve a pool team
      may be missing, so the page labels the source.

  - id: scouting_europe
    label: European league-phase player appearances
    kind: provider
    primary: api_football
    fallback: []
    status: partial
    scope: 2026-27 league phases of the Champions League, Europa League and Conference League
    fields: [fixtures, lineups, player_minutes, appearances, rating]
    surfaces: [/scouting/, /sources/, /methodology/]
    note: >
      League-phase fixtures only; qualifiers and play-offs are excluded. The
      season /players endpoint mixes rounds, so the flag comes from the
      per-fixture player endpoint. A player not found is unknown unless the run
      is complete; unknown is never discounted.

  - id: scouting_pool
    label: Scouting player pool and starting-XI roles
    kind: provider
    primary: api_football
    fallback: []
    status: partial
    scope: configured scouting leagues, current season
    fields: [player_season_statistics, provider_rating, lineups, starting_xi_grids]
    surfaces: [/scouting/, /sources/, /methodology/]
    note: >
      Season player statistics and starting-XI lineups for the configured
      scouting universe. Seven enabled leagues return no player season
      statistics, and several leagues omit the formation and grid. Coverage is
      labelled per league; nothing is zero-filled or inferred.

  - id: event_layer
    label: Event-derived Aberdeen stats
    kind: derived
    primary: api_football
    fallback: []
    status: active
    scope: Aberdeen fixtures with lineups and events
    fields: [goals_conceded_on_pitch, clean_sheets, substitutions]
    surfaces: [/squad/, /themes/]
    note: Reconstructed from lineups and events; not tracking data.

  - id: squad_roster
    label: Official squad roster
    kind: source
    primary: afc_official
    fallback: [api_football]
    status: active
    scope: current men's team, one listed page per refresh
    fields: [name, shirt_number, position, loan_section, roster_inclusion]
    surfaces: [/squad/]
    note: >
      The official AFC men's team page is canonical for inclusion, position
      section, shirt number and the On loan section. It does not label injuries;
      no injury is inferred. API-Football remains the statistics and identity
      spine. API rows outside the official list are retained only for existing
      player links and are not squad players.

  - id: squad_identity
    label: Current squad identity and statistics
    kind: provider
    primary: api_football
    fallback: []
    status: active
    scope: current season
    fields: [player_id, name, age, nationality, position, shirt_number, status]
    surfaces: [/squad/]
    note: Curated player overrides correct identity or youth gaps; the official
      roster layer owns roster inclusion and loan-section status.

  - id: preferred_foot
    label: Preferred foot
    kind: provider
    primary: sportmonks
    fallback: [afc_official, wikipedia]
    status: gated
    scope: current squad
    fields: [preferred_foot]
    surfaces: [/squad/, /sources/]
    note: >
      Sportmonks is gated; AFC official yields no foot values today; Wikipedia
      is last resort with a revision permalink. One value is known; every other
      player is unknown rather than inferred.

  - id: transfers_candidate
    label: Transfer candidate feed
    kind: provider
    primary: api_football
    fallback: []
    status: active
    scope: Aberdeen full transfer history
    fields: [date, direction, clubs, kind]
    surfaces: [/transfers/, /sources/]
    note: Candidate feed only; it has no fees, loan end dates or recall terms.

  - id: transfer_register
    label: Published transfer register
    kind: curated
    primary: curated
    fallback: []
    status: active
    scope: 2019-20 to current
    fields: [confirmed_business, fees, loans, sell_ons]
    surfaces: [/transfers/]
    note: >
      Curated against AFC announcements and Wikipedia season records, with the
      API-Football candidate feed as discovery. Most rows are curated, not
      provider-confirmed; fees are mostly undisclosed.

  - id: loans
    label: Loan register
    kind: curated
    primary: curated
    fallback: []
    status: partial
    scope: current and historical
    fields: [loan_club, dates, recall, obligation, option]
    surfaces: [/loans/, /transfers/]
    note: Loan-out tags come from the register; end/recall/obligation terms are unknown.

  - id: broadcast_listings
    label: Broadcast and streaming listings
    kind: curated
    primary: afc_news
    fallback: [spfl]
    status: active
    scope: upcoming fixtures
    fields: [domestic_status, international_status, platform, medium, access, source_url, verified_at]
    surfaces: [/matchday/, /matches/, /fixtures/, /sources/]
    note: >
      Curated from official club and SPFL pages. Broadcaster schedules are not
      scraped, no price or stream is published, and an absent listing is not a
      claim that a match is not televised.

  - id: news
    label: AFC news headlines
    kind: provider
    primary: afc_news
    fallback: []
    status: active
    scope: current
    fields: [title, category, date, url]
    surfaces: [/news/]
    note: Listing metadata only; article bodies are not copied.

  - id: availability
    label: Injuries and availability
    kind: curated
    primary: afc_news
    fallback: [api_football]
    status: partial
    scope: current squad and next opponent
    fields: [status, reason, expected_return, source, verified_at]
    surfaces: [/squad/, /matchday/, /themes/, /recruitment/]
    note: >
      Curated official AFC team news is primary. API-Football /injuries is an
      optional provider snapshot; its current-season Scottish coverage is
      reported false. Provider 'injured' booleans are not team news.

  - id: rumours
    label: Curated rumour register
    kind: curated
    primary: curated
    fallback: []
    status: active
    scope: current
    fields: [claim, status, confidence, sources]
    surfaces: [/rumours/, /recruitment/]
    note: Unconfirmed links, separate from the confirmed register.

  - id: forum_signal
    label: Fan signal
    kind: derived
    primary: afc_chat
    fallback: []
    status: active
    scope: sampled first pages
    fields: [mentions, cross_references, sentiment]
    surfaces: [/rumours/]
    note: Sampled, rule-based, no raw posts or usernames.

  - id: history
    label: Cormack-era historical record
    kind: mixed
    primary: mixed
    fallback: []
    status: active
    scope: 2019-20 to current
    fields: [staff, honours, transfers, style, selection, reviews]
    surfaces: [/history/]
    note: >
      Mixed sources: API-Football backfill, football-data style proxies, AFC
      official and Wikipedia curation. The season documents label their basis.

  - id: valuation
    label: Inferred transfer values
    kind: derived
    primary: curated
    fallback: []
    status: active
    scope: transfer register
    fields: [fee_range, confidence, method]
    surfaces: [/transfers/, /methodology/]
    note: Disclosed/reported anchors plus a transparent age/position/market model.

  - id: former_player_record
    label: Former-player record
    kind: derived
    primary: api_football
    fallback: [wikipedia]
    status: active
    scope: 2019-20 to current
    fields: [departure, tenure, post_career, sell_on_watch, development]
    surfaces: [/former-players/, /transfers/, /status/]
    note: >
      Derived from the confirmed transfer register, the covered Aberdeen history
      and licensed API-Football player seasons. Post-career league rows are
      measured where covered; missing seasons and curated-only identities are
      explicit gaps.

  - id: sell_on_events
    label: Sell-on event evidence
    kind: curated
    primary: curated
    fallback: []
    status: active
    scope: 2019-20 to current
    fields: [subsequent_transfer, fee_anchor, receipt]
    surfaces: [/former-players/, /transfers/]
    note: >
      A subsequent transfer is detected from the provider history; a receipt is
      computed only when the clause percentage, basis and every required public
      fee are evidenced. Missing inputs are published, never inferred.

  - id: themes
    label: Medium and long-term themes
    kind: derived
    primary: derived
    fallback: []
    status: active
    scope: current season + Cormack era
    fields: [family_balance, shape_tradeoff, cover, balance, mission]
    surfaces: [/themes/, /matchday/]
    note: Derived from lineups, events, provider ratings, league rows and history.

  - id: needs
    label: Squad needs
    kind: derived
    primary: derived
    fallback: []
    status: active
    scope: current squad
    fields: [cover, replace, strengthen, market_route]
    surfaces: [/recruitment/, /scouting/, /themes/]
    note: >
      Derived from themes, availability, squad minutes, transfers and rumours.
      Role profiles only; no targets or invented fees.

  - id: xg_model
    label: fitba expected goals
    kind: derived
    primary: computed
    fallback: [football_data_uk, api_football]
    status: experimental
    scope: current-season league matches with shot-zone inputs
    fields: [fxg, fxg_range, evaluation]
    surfaces: [/analysis/xg/, /matches/, /sources/, /methodology/]
    note: >
      The fxG model is derived from licensed shot and match features. It is
      descriptive; the provider-xG evaluation gate is failing, so it is not a
      confidence verdict or tracking data.

  - id: odds
    label: Betting odds
    kind: none
    primary: none
    fallback: []
    status: not_published
    scope: n/a
    fields: []
    surfaces: []
    note: Not ingested or published.

excluded:
  - id: bbc_sport
    reason: Terms prohibit scraping or republication; manual finding aid only.
  - id: transfermarkt
    reason: Scraping prohibited; not used for public data.
  - id: fotmob
    reason: Terms prohibit scraping or republication.
  - id: sofascore
    reason: Terms prohibit scraping or republication.
  - id: fbref
    reason: Scraping prohibited; written permission required.
  - id: pannadata
    reason: No licence stated; local research only, never published.
