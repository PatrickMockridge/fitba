  - label: Fixtures
    href: /fixtures/
- id: defence
  domain: matchday
  order: 2
  title: The defence
  claim: Three at the back is protecting a new defence at the cost of width.
  better_data: Eight or more matches per shape, opponent strength, official team news
    and an event feed for set plays and errors would separate shape from personnel.
  change_mind: A run of three centre-back games with the first-choice centre-backs available
    and goals conceded at or below the back four.
  links:
  - label: Squad
    href: /squad/
  - label: Matchday
    href: /matchday/
  - label: Transfers
    href: /transfers/
- id: attack
  domain: matchday
  order: 3
  title: The attack
  claim: The attack is keeping the team in games, but the balance is fragile; set
    plays and errors are part of the problem.
  better_data: A licensed event feed with set-piece goals, errors leading to shots
    or goals, and penalties would test the claim directly.
  change_mind: Event data, or a run of clean sheets and lower goals against.
  links:
  - label: Fixtures
    href: /fixtures/
  - label: Matchday
    href: /matchday/
  - label: Methodology
    href: /methodology/
- id: managers
  domain: chairman
  order: 4
  title: The managers
  claim: Thelin's side had a high ceiling and a low floor; Robinson has steadied it,
    but 18 league matches is not enough to settle it.
  better_data: A full season under Robinson, opponent strength and a pre-declared
    variance measure.
  change_mind: A full season, or a sustained points and goals-against trend.
  links:
  - label: The Cormack era
    href: /history/
  - label: Fixtures
    href: /fixtures/
  - label: Matchday
    href: /matchday/
- id: squad
