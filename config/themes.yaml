mission:
  pillars_source: reference/history/era.yaml
  commercial_context: 'Commercial growth and fanbase expansion are part of the public
    framing of the Cormack era. They are context only: the public football data cannot
    measure them, so they are not scored.

    '
case:
  owner_label: The owner's view
  owner_attribution: Patrick Mockridge
  owner_view: 'I think the club is trying to lower its variance and become harder
    to beat: a high press, a direct and counter-attacking game, balls over the top
    for Olusanya, and three physical centre-backs at set plays. The cost has been
    unforced errors, cheap penalties and getting the players to gel. Thelin''s side
    had a fast start, a long winless run, the Scottish Cup and then a recycled squad;
    Morris was sold and we lost a main goal threat; injuries and opponents adapting
    followed. Robinson steadied it. The question is whether the model is now producing
    a more resilient team, or just a different set of trade-offs.'
  chairman_label: The chairman's frame
  chairman_frame: 'Since Dave Cormack took over in December 2019, the club has described
    a trading model: buy low, develop, sell high, reinvest, and keep the squad and
    wage bill sustainable. The public record below shows what that approach has produced
    and what it has cost.'
  chairman_source: reference/history/era.yaml; docs/history.md
  chairman_note: A summary of the club's stated approach from the public record; not
    a direct quotation.
  thesis: The team on the pitch is the visible edge of a seven-year trading model.
    The question is what that model buys, what it costs, and what the record can prove.
claims:
- id: team_now
  domain: matchday
  order: 1
  title: The team now
  claim: This is a rebuilt side with an unsettled shape, and the league record is
    mid-table.
  better_data: An event feed would separate style from results; it would not change
    the league record.
  change_mind: A settled run of results and a stable shape.
  links:
  - label: Matchday
    href: /matchday/
  - label: Competitions
