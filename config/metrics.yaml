- id: transfers.summary
  label: Transfer summary
  description: Register totals, players and period.
  value_type: object
  fields:
  - total
  - confirmed
  - curated
  - players
  - seasons_covered
  - windows_covered
  formula:
    total: len(transfers)
    confirmed: count verification_status == confirmed
    curated: count verification_status == curated
    players: distinct player_key
    seasons_covered: distinct season
    windows_covered: distinct (season, window)
  inputs:
