- id: needs.family
  label: Needs families
  description: Per-family depth, quality, availability, market and roster metrics.
  value_type: object
  fields: []
  formula: 'measured_score = 100 * sum(w*x)/sum(w) over available drivers: depth_gap
    0.30, quality_gap 0.20, top_share 0.10, availability_risk 0.25, age_risk 0.15.
    availability_risk = (out + 0.5*doubtful)/known projected players; null when known
    = 0.'
  inputs:
  - published payload
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: inferred
  source_layer: needs
  coverage_tier: derived
  confidence_rule: Declared by the source metric; see docs/methodology.md.
  home_payload: needs/aberdeen.json
