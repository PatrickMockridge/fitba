- id: matchday.form
  label: Matchday form
  description: Recent and split form for both teams.
  value_type: object
  fields:
  - played
  - won
  - drawn
  - lost
  - points
  - ppg
  - gf
  - ga
  - gd
  - shots_for_pm
  - shots_against_pm
  - gf_pg
  - ga_pg
  - gd_pg
  formula:
    played: won + drawn + lost
    points: 3*won + drawn
    gd: gf - ga
    ppg: points / played
    gf_pg: gf / played
    ga_pg: ga / played
    gd_pg: gd / played
  inputs:
  - published payload
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    counts:
      method: half_even
      decimals: 0
      display: '0'
    rates:
      method: half_even
      decimals: 2
      display: '0.00'
  basis: measured
  source_layer: league_results_current
  coverage_tier: match
  confidence_rule: Declared by the source metric; see docs/methodology.md.
  home_payload: matchday/upcoming.json
  payload_paths:
  - matchday/upcoming.json#/teams/*/form/**
  - matchday/upcoming.json#/form_guide/*/**
  home_surface: /matchday/
