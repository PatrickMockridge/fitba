- id: scouting.pool
  label: Scouting player pool
  description: One row per ranked player per league with provider season statistics,
    within-league role percentiles and profile scores.
  value_type: object
  fields:
  - players
  - minutes
  - appearances
  - age
  - rating
  - rating_percentile
  - cohort_n
  - role_family_share
  - goals_p90
  - assists_p90
  - goals_assists_p90
  - shots_p90
  - dribbles_success_p90
  - passes_completed_p90
  - key_passes_p90
  - tackles_p90
  - interceptions_p90
  - pass_completion_pct
  - duel_win_pct
  - dribble_success_pct
  - conversion_pct
  - save_pct
  - conceded_p90
  - saves_p90
  - rose
  - rose_meta
  - team_rank
  - team_points
  - team_played
  - team_ppg
  - team_count
  - team_points_percentile
  - team_underperforming
  - team_lift
  - percentile
  - archetype_score
  - archetype_coverage
  - scouting_priority
  - age_multiplier
  - europe_multiplier
  - european_league_phase_minutes
  - european_league_phase_appearances
  - european_status
  - current_club_status
  - stats_club
  - current_club_source
  - transferred_at
  formula: >
    Per-90 values are stat * 90 / minutes. Completed passes are passes_total *
    pass_accuracy / 100. Duel and dribble percentages divide by their provider
    attempts; conversion divides goals by shots; save percentage divides saves
    by saves + conceded. The rating percentile is the midrank percentile of the
    provider rating within the league and role family at 450+ minutes; the
    provider-group fallback is used only when the role cohort is below its
    minimum. Archetype scores are 100 * Phi(sum(w * shrunk robust z) / sum(abs(w))),
    with winsorisation at 1/99, median/MAD scaling, minutes shrinkage and weight
    renormalisation. The rose uses the same league-only rates: each axis is the
    midrank percentile of the raw value in the same role-family cohort (provider
    group fallback), with conceded_p90 ranked on negated values. Missing values
    and insufficient cohorts are null.
  inputs:
  - published payload
  - config/scouting/model.yaml
  - config/scouting/archetypes.yaml
  - config/player-rose.yaml
  unit: mixed
  aggregation: per_player
  denominator: minutes; passes_total; duels_total; dribbles_attempts; shots_total;
    saves + conceded
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: mixed
  source_layer: scouting_pool
  coverage_tier: match
  confidence_rule: Published only where the provider value exists and the player
    has at least 450 minutes; cohorts must meet their minimum or the percentile
    is null. Unknown is never zero.
  home_payload: scouting/pool/sco-premiership.json
  payload_paths:
  - scouting/pool/*.json#/**
  - scouting/search-index.json#/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  - /scouting/search/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - Provider ratings are opaque and relative to a league and role cohort; no
    cross-league ranking is published.
  - The feed has no xG/xA, progressive passes, carries, pressures, aerial wins
    or crosses, so those features are absent rather than inferred.
  - Role families need starting-XI grids; leagues without grids use the provider
    position group and say so.
  - Scouting priority is an Aberdeen preference, not a measured quality term.
  - The current club comes from the provider transfer feed; the stats club is
    kept where it differs. A subsequent move outside a pool team may be missing.
  - Rose percentiles are within the league and role cohort, not a cross-league
    rank. A missing or insufficient cohort is null, never zero.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 5
  status: active
- id: scouting.board
  label: Scouting weakness board
  description: Aberdeen role-family ratings against the Scottish Premiership cohort,
    with verified availability evidence.
  value_type: object
  fields:
  - families
  - players
  - minutes
  - average_rating
  - rating_percentile
  - cohort_n
  - cohort_median
  - absent_first_choice
  - layer0_players
  formula: >
    The family average is the appearance-weighted mean provider rating of
    Aberdeen players at 300+ competitive minutes in the role family. The
    percentile is the midrank position of that average within the other
    Premiership players in the same role family at 450+ minutes; Aberdeen are
    excluded from their own cohort. The reading is structural below 40, at
    40-60, above 60; a below-cohort family with one absent first-choice player
    is cover, two or more is hold. First-choice evidence is 10 starts or 900
    minutes in the most recent prior season with at least 450 minutes.
  inputs:
  - published payload
  - data/normalized/history/season=*/appearances.parquet
  - reference/availability.yaml
  unit: mixed
  aggregation: role_family
  denominator: minutes
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: mixed
  source_layer: scouting_pool
  coverage_tier: derived
  confidence_rule: A family is not ranked without a qualifying cohort; availability
    is used only from the verified ledger. The reading is evidence, not a medical
    or selection verdict.
  home_payload: scouting/aberdeen.json
  payload_paths:
  - scouting/aberdeen.json#/board/**
  - scouting/aberdeen.json#/layer_zero/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - The model cannot separate selection, availability and quality.
  - The provider rating is not a verdict; the cohort is the other Premiership
    players in the same role family, not a like-for-like cross-league pool.
  - Only verified official AFC team news can mark a player out or available.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 1
  status: active
- id: scouting.archetypes
  label: Scouting archetype profiles
  description: Weighted player-profile scores, their feature weights, coverage,
    the attacker assist/goal split and the dedicated goal-scoring list.
  value_type: object
  fields:
  - score
  - adjusted_score
  - coverage
  - minutes
  - rating
  - rating_percentile
  - bias
  - assist_score
  - goal_score
  - goal_scoring
  formula: >
    Each archetype is a weighted composite of winsorised, robust z-scores within
    league and role family: z = (x - median) / (1.4826 * MAD), shrunk by
    minutes / (minutes + 450), combined with signed weights and mapped to 0-100
    by the normal CDF. Missing features are removed and the remaining absolute
    weights renormalised; below 70% coverage the score is null. Weights are in
    config/scouting/archetypes.yaml and are published with the score.
  inputs:
  - published payload
  - config/scouting/archetypes.yaml
  - config/scouting/model.yaml
  unit: index
  aggregation: per_player
  denominator: minutes
  rounding:
    method: half_even
    decimals: 1
    display: '0.0'
  basis: inferred
  source_layer: computed
  coverage_tier: derived
  confidence_rule: A profile is published only for its applicable role families
    and with at least 70% of the absolute weight present; otherwise null.
  home_payload: scouting/aberdeen.json
  payload_paths:
  - scouting/aberdeen.json#/archetypes/**
  - scouting/aberdeen.json#/attackers/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - A profile is not a position, a target or a recommendation.
  - Assist bias and goal bias are separate attacker profiles. Each leader list
    is ordered by its own adjusted profile score multiplied by the U23 and
    European preferences; the goal-scoring table is ordered by goals per 90,
    not by a composite.
  - The assist profile weights passes, key passes, pass accuracy and dribbles.
    The feed carries no crosses or chance-creation data, so those are absent
    rather than inferred.
  - The goal profile deliberately excludes pass and dribble volume so it does
    not reproduce the assist order.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 3
  status: active
- id: scouting.team-lens
  label: Scouting team-context lens
  description: Players outperforming teams that are underperforming in their league.
  value_type: object
  fields:
  - team_rank
  - team_points
  - team_played
  - team_ppg
  - team_count
  - team_points_percentile
  - team_underperforming
  - team_lift
  - leaders
  formula: >
    Team points per game = points / played in the provider's current league
    table. The team points percentile is the midrank percentile of that value
    among the league's teams. team_lift = player role-adjusted percentile -
    team points percentile. A team is underperforming when its percentile is at
    or below the configured maximum (default 40). The lens keeps players with a
    positive lift at those teams, ordered by lift then scouting priority. A
    league without a table is unknown, never zero-strength.
  inputs:
  - published payload
  - data/normalized/scouting/team_standings.parquet
  - config/scouting/team-context.yaml
  unit: mixed
  aggregation: per_player
  denominator: team matches played
  rounding:
    method: half_even
    decimals: 1
    display: '0.0'
  basis: inferred
  source_layer: computed
  coverage_tier: derived
  confidence_rule: >
    Published only where the league table and team row exist; missing standings
    are unknown. The lift is a contrast, not a valuation, forecast or
    recommendation.
  home_payload: scouting/aberdeen.json
  payload_paths:
  - scouting/aberdeen.json#/team_lens/**
  - scouting/pool/*.json#/players/**/team_**
  - scouting/coverage.json#/team_context/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  - /scouting/search/
  - /scouting/player/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - Team underperformance is a within-league points-per-game contrast, not a
    budget, wage or resource model.
  - A player's role-adjusted percentile and a team's points percentile are
    different units; the lift is a descriptive ranking aid, not a causal claim.
  - A league without a current table is unknown, not zero-strength.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 1
  status: active
- id: scouting.squad
  label: Scouting squad profile
  description: Aberdeen registered-squad position-specific per-90 output, competitive
    matches only.
  value_type: object
  fields:
  - players
  - minutes
  - rating
  - rating_percentile
  - goals
  - assists
  - goals_p90
  - assists_p90
  - goals_assists_p90
  - shots_p90
  - dribbles_success_p90
  - passes_completed_p90
  - key_passes_p90
  - tackles_p90
  - interceptions_p90
  - pass_completion_pct
  - duel_win_pct
  - saves_p90
  - rose
  formula: >
    The same per-90 and percentage formulas as scouting.pool, applied to the
    registered Aberdeen squad in competitive matches only (friendlies and
    loan-club rows excluded), at 180+ minutes. The rating is appearance-weighted;
    the percentile is within the Premiership role cohort. The rose uses
    Premiership-only rates against the same league and role cohort.
  inputs:
  - published payload
  - data/normalized/squad/aberdeen_stats.parquet
  unit: mixed
  aggregation: per_player
  denominator: minutes
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: mixed
  source_layer: squad_identity
  coverage_tier: match
  confidence_rule: A player is listed at 180+ competitive minutes; a missing
    provider value is null, never zero.
  home_payload: scouting/aberdeen.json
  payload_paths:
  - scouting/aberdeen.json#/squad/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  - /squad/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - Forward and progressive passes, carries and pressures are not in the feed;
    they are unavailable, not inferred.
  - Loanees out are excluded; their loan-club rows are not Aberdeen output.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 2
  status: active
- id: scouting.coverage
  label: Scouting coverage
  description: Per-league provider coverage, role coverage and pool counts.
  value_type: object
  fields:
  - leagues
  - searchable
  - no_player_stats
  - players
  - rated
  - with_minutes_450
  - role_players
  - role_coverage
  - lineups_fetched
  - fixtures_played
  - europe
  - current_clubs
  - team_context
  formula: >
    Counts of provider player-season rows, rated rows, rows at 450+ minutes,
    players with at least one starting-XI role, played fixtures and lineups
    fetched. Role coverage is role players divided by the league pool. Searchable
    requires at least 25 rated players.
  inputs:
  - published payload
  - data/normalized/scouting/meta.json
  - data/normalized/scouting/roles_state.json
  unit: mixed
  aggregation: league
  denominator: league player rows
  rounding:
    method: half_even
    decimals: 3
    display: '0.000'
  basis: measured
  source_layer: scouting_pool
  coverage_tier: derived
  confidence_rule: Every league reports what the provider returned; an empty
    response is labelled, not zero-filled.
  home_payload: scouting/coverage.json
  payload_paths:
  - scouting/coverage.json#/**
  - scouting/aberdeen.json#/leagues/**
  - scouting/aberdeen.json#/coverage/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - Coverage is a provider fact at the last sync, not a permanent statement.
  - Scottish lower tiers have lineups but no player season statistics.
  - Current-club coverage comes from the team transfer feed and may miss a later
    move outside a pool team.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 4
  status: active

- id: scouting.value-model
  label: Scouting value model
  description: The 0-100 scouting value index and the anchor-gated GBP value model.
  value_type: object
  fields:
  - anchor_count
  - usable_anchors
  - gate
  - sample
  - coefficients
  - residual_sd
  - in_sample_mae
  - loocv_mae
  - max_loocv_error
  - r2
  - interval
  - value_index
  - value_index_coverage
  - value_low_gbp
  - value_high_gbp
  formula: >
    Value index = 100 * sum(w_i * component_i) / sum(w_i) over performance
    (league-adjusted percentile / 100), age curve, minutes reliability
    (min(1, minutes / 1800)) and best adjusted profile score / 100. Weights are
    renormalised over available components and the index is null below 70%
    coverage. The GBP band is fitted only after the public-source anchor gate
    passes: log(value_gbp) = b0 + b1*adjusted_percentile/100 + b2*age +
    b3*age^2 + b4*log(minutes) + role-group dummies. The published band is the
    80% prediction interval. No GBP value is published before the gate.
  inputs:
  - published payload
  - reference/scouting_values.yaml
  - config/scouting/value.yaml
  unit: mixed
  aggregation: per_player
  denominator: minutes
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: inferred
  source_layer: computed
  coverage_tier: derived
  confidence_rule: The index is published only with at least 70% of the weight
    present. The GBP band is published only when the anchor gate passes; the
    gate requires 60 usable anchors, role, tier and age coverage. A missing band
    is null, never zero.
  home_payload: scouting/value-model.json
  payload_paths:
  - scouting/value-model.json#/**
  - scouting/aberdeen.json#/value_model/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  - /scouting/search/
  verification: provenance_only
  implementation: null
  source_paths:
  - reference/scouting_values.yaml
  limitations:
  - The value index is a scouting ordering, not a transfer value or fee.
  - The GBP band is not published until the public-source anchor register passes
    the gate; it is never an uncalibrated currency estimate.
  - Contract length, wages, release clauses and agent fees are unknown.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 1
  status: active

- id: scouting.priority
  label: Scouting priority
  description: U23 and European shop-window weighting on top of the value index.
  value_type: object
  fields:
  - scouting_priority
  - age_multiplier
  - europe_multiplier
  - european_league_phase_minutes
  - european_league_phase_appearances
  - european_status
  formula: >
    scouting_priority = value_index * age_multiplier * europe_multiplier.
    age_multiplier = u23_multiplier when age <= u23_max_age, else 1.0.
    europe_multiplier = europe_multiplier when european league-phase minutes
    >= europe_minutes_threshold, else 1.0. The European flag is built from the
    league-phase fixtures of the Champions League, Europa League and Conference
    League and the per-fixture player endpoint; qualifiers and play-offs are
    excluded. A player not found is none only when coverage is complete;
    otherwise the status is unknown and the multiplier is 1.0.
  inputs:
  - published payload
  - config/scouting/value.yaml
  - data/normalized/scouting/europe_appearances.parquet
  unit: index
  aggregation: per_player
  denominator: null
  rounding:
    method: half_even
    decimals: 1
    display: '0.0'
  basis: inferred
  source_layer: computed
  coverage_tier: derived
  confidence_rule: Priority is published only where the value index exists.
    European status unknown is never discounted. The weight is a scouting
    preference, not a measured quality equivalence.
  home_payload: scouting/aberdeen.json
  payload_paths:
  - scouting/pool/*.json#/**
  - scouting/search-index.json#/**
  - scouting/aberdeen.json#/priority/**
  - scouting/aberdeen.json#/europe_coverage/**
  - scouting/aberdeen.json#/archetypes/**
  - scouting/aberdeen.json#/pivot/**
  - scouting/coverage.json#/europe/**
  home_surface: /scouting/
  displayed_surfaces:
  - /scouting/
  - /scouting/search/
  - /scouting/player/
  verification: provenance_only
  implementation: null
  source_paths:
  - data/normalized/scouting/europe_appearances.parquet
  limitations:
  - The U23 boost and the European shop-window discount are Aberdeen scouting
    preferences, not measured quality.
  - Only the league phase of the three UEFA competitions is used; qualifiers,
    play-offs and domestic Europe are not.
  - A player with fewer than 90 league-phase minutes is shown but not
    discounted. Unknown European status is not discounted.
  - Priority is not a transfer value or a fee.
  owner: patrickmockridge
  reviewed: '2026-10-23'
  version: 1
  status: active

