- id: player.page
  label: Player pages
  description: Per-player page panels, two-figure Nightingale rose, availability
    projection and recent match log.
  value_type: object
  fields:
  - tier
  - current_squad
  - out_of_squad
  - out_of_squad_reason
  - minutes
  - minutes_season
  - appearances
  - rating
  - rating_percentile
  - cohort_basis
  - cohort_n
  - rose_season
  - rose_fallback
  - rose
  - season_used
  - cohort_season
  - fallback
  - fallback_reason
  - fallback_note
  - figures
  - axes
  - value
  - percentile
  - availability
  - recent_matches
  formula: >
    Document envelope: player totals, playing time, role evidence, position
    stats, the published rose axes, the curated availability projection and the
    latest competitive match rows for one player. The rose uses league-only
    rates from the provider season totals; each percentile is the midrank rank
    of the raw value in the player's league and role cohort (provider-group
    fallback), with conceded_p90 ranked on negated values. The percentile is
    null when the cohort or value is unavailable. Where current-season
    Premiership minutes are below the squad threshold, the rose uses the most
    recent prior Premiership season with at least 180 league minutes and a
    same-season cohort; season_used, cohort_season, fallback and fallback_note
    are published and visible. The summary minutes remain current-season. The
    match log is a projection of the normalized player-match rows joined to the
    fixture date, opponent and score; it is not recomputed in React.
  inputs:
  - published payload
  - data/normalized/matches/player_match_stats.parquet
  - data/normalized/matches/player_appearances.parquet
  - availability/aberdeen.json
  - config/player-rose.yaml
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: mixed
  source_layer: player_match_stats
  coverage_tier: event
  confidence_rule: Declared by the source metric; see docs/methodology.md. A
    rose percentile is null when the cohort minimum, player minutes gate or
    feature value is missing; a missing match-log value is null, never zero.
  home_payload: players/*.json
  payload_paths:
  - players/*.json#/**
  home_surface: /players/
  displayed_surfaces:
  - /players/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - Player page rows; provenance checked, not recomputed.
  - The provider rating is opaque and league-relative; it is not a verdict.
  - Rose percentiles are within one league and role cohort; there is no
    cross-league ranking.
  - Availability is the curated ledger projection, not an inferred injury.
  - The recent match log is limited to the latest 10 competitive current-season
    rows with provider coverage; missing values are a dash.
  owner: patrickmockridge
  reviewed: '2026-10-24'
  version: 5
  status: active
