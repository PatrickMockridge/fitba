- id: xg.document
  label: fxG document
  description: Team-match expected goals from open-play shot zones, shots on
    target, blocked shots and penalties; a model range, a goals range,
    provider-xG calibration, transfer check, provider-style estimate, manager
    splits, aggregates and coverage.
  value_type: object
  fields:
  - model
  - evaluation
  - transfer_evaluation
  - matches
  - aggregates
  - coverage
  - provider_estimate
  - manager_splits
  formula: 'open_play_sot = max(0, shots_on_target - penalty_sot_subtracted);
    open_play_insidebox = max(0, shots_insidebox - penalty_attempts); fxG_open =
    a selected linear model on open-play inside-box, outside-box, shots on
    target, off-target and blocked counts; fxG = fxG_open + 0.76 * penalty_attempts.
    Coefficients are fitted by OLS to 2026-27 Premiership team rows where
    provider xG exists. The 80% model range is the 10th-90th percentile of
    match-clustered bootstrap predictions plus the leave-one-match-out residual
    pool. The 80% goals range is the convolution of a beta-binomial open-play
    distribution and a binomial penalty distribution. Aggregate variances are
    combined, never summed as intervals. provider_estimate = max(0, intercept +
    slope * fxg) for rows without provider xG; actual and estimated provider
    values are never summed. manager_splits sum league match rows by
    date-attributed manager stint, for and against separately.'
  inputs:
  - published payload
  unit: mixed
  aggregation: document
  denominator: null
  rounding:
    method: half_even
    decimals: 3
    display: '0.000'
  basis: inferred
  source_layer: computed
  coverage_tier: derived
  confidence_rule: Declared by the payload fields and the source row; see docs/methodology.md.
  home_payload: xg/aberdeen.json
  payload_paths:
  - xg/aberdeen.json#/**
  home_surface: /analysis/xg/
  displayed_surfaces:
  - /analysis/xg/
  - /matches/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - fxG is a team-match estimate from shots, shot zones and penalties. It is not
    a location model, not xGOT and not provider xG. The record has no shot
    coordinates, distance, angle, body part, pressure or goalkeeper position.
  - The coefficients are calibrated to 2026-27 football-data provider xG. The
    gate is leave-one-match-out inside that season; the 2025-26 API-Football
    check crosses season and provider and is informational, not a clean holdout.
  - Penalties are priced at a fixed 0.76 xG and removed from open-play counts.
    Own goals, deflections and shootouts are outside the model.
  - The two ranges answer different questions. Neither is a confidence interval
    for team quality, a result prediction or proof of finishing skill. A discrete
    goals range can cover more than its nominal level.
  - The provider-style estimate is a separate calibration for rows without
    provider xG, not provider xG itself.
  owner: patrickmockridge
  reviewed: '2026-10-24'
  version: 7
  status: active
