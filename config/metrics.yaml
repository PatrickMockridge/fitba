- id: needs.summary
  label: Needs summary
  description: Family counts and availability summary.
  value_type: object
  fields:
  - families
  - cover
  - strengthen
  - replace
  - availability_known
  - availability_unknown
  - counts
  - top_priority
  formula:
    families: len(families)
    counts: count families by category
    availability_known: count squad players with availability.status != unknown
    availability_unknown: squad players - availability_known
  inputs:
  - published payload
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    method: half_even
    decimals: 0
    display: '0'
