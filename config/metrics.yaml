- id: matchday.form
  label: Matchday form
  description: Recent and split form for both teams.
  value_type: object
  fields:
  - played
  - won
  - drawn
  - lost
  - points
  - ppg
  - gf
  - ga
  - gd
  - shots_for_pm
  - shots_against_pm
  - gf_pg
  - ga_pg
  - gd_pg
  formula:
    played: won + drawn + lost
    points: 3*won + drawn
    gd: gf - ga
    ppg: points / played
    gf_pg: gf / played
    ga_pg: ga / played
    gd_pg: gd / played
  inputs:
  - published payload
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    counts:
      method: half_even
      decimals: 0
      display: '0'
    rates:
      method: half_even
      decimals: 2
      display: '0.00'
  basis: measured
  source_layer: league_results_current
  coverage_tier: match
  confidence_rule: Declared by the source metric; see docs/methodology.md.
  home_payload: matchday/upcoming.json
  payload_paths:
  - matchday/upcoming.json#/teams/*/form/**
  - matchday/upcoming.json#/form_guide/*/**
  home_surface: /matchday/
  displayed_surfaces:
  - /matchday/
  verification: recompute
  implementation: fitba.metrics.checks:verify_matchday_form
  source_paths: []
  limitations:
  - Registered family; provenance checked, not recomputed.
  owner: patrickmockridge
  reviewed: '2026-10-22'
  version: 1
  status: active
- id: matchday.strength
  label: Matchday strength
  description: League strength, percentiles and comparison.
  value_type: object
  fields:
  - ppp
  - ppg
  - gf_pg
  - ga_pg
  - gd_pg
  - shots_for_pm
  - shot_share
  - ranks
  - league_size
  - position_gap
  - ppg_gap
  formula: ppp = points/played; ppg = points/played; gf_pg = gf/played; ga_pg = ga/played;
    gd_pg = (gf-ga)/played; shots_for_pm = shots/matches; shot_share = team shots/(team
    + opponent shots); rank = 1 + count of better teams (lower is better for ga_pg);
    league_size = teams in the league; position_gap and ppg_gap = team value minus
    opponent value. Percentiles set the bar length; ranks set the visible label.
  inputs:
  - published payload
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: inferred
  source_layer: league_standings
  coverage_tier: derived
  confidence_rule: Declared by the source metric; see docs/methodology.md.
  home_payload: matchday/upcoming.json
  payload_paths:
  - matchday/upcoming.json#/teams/*/strength/**
  - matchday/upcoming.json#/strength/*/**
  - matchday/upcoming.json#/strength_comparison/**
  home_surface: /matchday/
  displayed_surfaces:
  - /matchday/
  verification: cross_surface
  implementation: fitba.metrics.checks:verify_matchday_strength
  source_paths: []
  limitations:
  - Registered family; provenance checked, not recomputed.
  owner: patrickmockridge
  reviewed: '2026-10-24'
  version: 4
  status: active
- id: matchday.style
  label: Matchday style
  description: Shot profile, approach index and style lean.
  value_type: object
  fields: []
  formula: Approach index is the mean of within-league percentiles for shots, shots
    on target, goals and corners; possession is not used. Style lean is the sign of
    the approach index against the league median.
  inputs:
  - published payload
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    method: half_even
