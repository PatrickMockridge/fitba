  home_surface: /matchday/
  displayed_surfaces:
  - /matchday/
  verification: provenance_only
  implementation: null
  source_paths: []
  limitations:
  - Selection and formation projections; provenance checked, not recomputed.
  owner: patrickmockridge
  reviewed: '2026-10-22'
  version: 2
  status: active
