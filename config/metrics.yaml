owner: patrickmockridge
change_policy:
  owner_approval_required: true
  version_scheme: semver
  changelog: docs/metric-changes.md
structural_number_patterns:
- '**/player_id'
- '**/team_id'
- '**/api_team_id'
- '**/match_id'
- '**/fixture_id'
- '**/shirt_number'
- '**/order'
- '**/tier'
- '**/row'
- '**/column'
- '**/bytes'
- '**/schema_version'
- '**/version'
- '**/season'
- '**/*_at'
- '**/checksum'
- '**/after_position'
- '**/minute'
- '**/stoppage'
- '**/shootout_home'
- '**/shootout_away'
metrics:
- id: table.record
  label: League table record
  description: Per-team league record and ranking inputs.
  value_type: table
  fields:
  - position
  - played
  - won
  - drawn
  - lost
  - gf
  - ga
  - gd
  - raw_points
  - deduction
  - points
  - form
  formula:
    played: won + drawn + lost
    gd: gf - ga
    raw_points: 3*won + drawn
    points: raw_points - deduction
  inputs:
  - published payload
  unit: mixed
  aggregation: per_team
  denominator: null
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: measured
  source_layer: league_standings
  coverage_tier: match
  confidence_rule: Declared by the source metric; see docs/methodology.md.
  home_payload: tables/*.json
  payload_paths:
  - tables/*.json#/rows/**
  home_surface: /competitions/
  displayed_surfaces:
  - /
  - /competitions/
  - /status/
  verification: recompute
  implementation: fitba.metrics.checks:verify_table_record
  source_paths: []
  limitations:
  - Registered family; provenance checked, not recomputed.
  owner: patrickmockridge
  reviewed: '2026-10-22'
  version: 1
  status: active
- id: table.cutoffs
  label: League cutoffs
  description: League positions and cutoff labels.
  value_type: object
