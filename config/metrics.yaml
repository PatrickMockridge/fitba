- id: matchday.lineup
  label: Predicted XI
  description: Predicted lineups, scores, selection weights and availability.
  value_type: object
  fields: []
  formula: Player score = 0.20*form + 0.10*minute_share + 0.15*recent_rating + 0.15*role_fit
    + 0.18*recency_start + 0.22*start_rate. Availability counts curated entries; opponent
    availability is not modelled.
  inputs:
  - published payload
  unit: mixed
  aggregation: family
  denominator: null
  rounding:
    method: half_even
    decimals: 2
    display: '0.00'
  basis: inferred
  source_layer: lineups_roles
  coverage_tier: event
  confidence_rule: Declared by the source metric; see docs/methodology.md.
