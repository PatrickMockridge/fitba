# Scouting universe.
#
# `strength_prior` is a 0-100 prior, not a measured league strength. It is kept
# for a future league adjustment and is NOT used in the phase-one ranking:
# provider ratings are compared only within a league and role family.
#
# `coverage` is the intended data depth for that league:
#   event | match | curated | value_only
#
# `provider` is what API-Football actually returns, verified 2026-10-23:
#   api_football_id - the provider league id used by /players and /fixtures;
#   player_stats    - the season player-statistics endpoint returns rows;
#   lineups         - /fixtures/lineups is advertised for the season.
# Scottish lower tiers advertise lineups but return no player statistics, so
# they have honest empty search pages rather than zero-filled rows.
#
# `slug` is the stable URL segment for /scouting/<slug>/.
pool:
  - { id: sco:premiership,     slug: sco-premiership,     name: Scottish Premiership,       country: Scotland, tier: 1, enabled: true,  strength_prior: 55, coverage: event, provider: { api_football_id: 179, player_stats: true,  lineups: true } }
  - { id: sco:championship,    slug: sco-championship,    name: Scottish Championship,      country: Scotland, tier: 2, enabled: true,  strength_prior: 38, coverage: match, provider: { api_football_id: 180, player_stats: false, lineups: true } }
