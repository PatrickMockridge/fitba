# fxG model policy.
#
# fxG is fitba's own team-match expected-goals estimate. It is not provider xG,
# and it is not a shot-level location model: the record has no shot coordinates.
# The model card in docs/xg.md must stay beside every published aggregate.

version: 3
model_id: fxg-3
label: fxG
status: experimental

fit:
  # Fallback conversion fit for rows without a calibrated model. The published
  # match values use the calibration block below when it has enough rows.
  before_season: 2026-27
  min_shots_on_target: 120
  prior_strength_sot: 250
  # Friendlies are not part of the competitive model.
  exclude_competition_prefixes: [sco:other:friendlies]

calibration:
  # fxG is a team-match estimate. The enriched candidates use open-play
  # inside/outside-box counts, shots on target and blocked shots where the
  # league-wide enrichment exists; the fallback is the original shot-volume
  # calibration. It is not provider xG and not a shot-level location model.
  season: 2026-27
  competition_id: sco:premiership
  league_id: 179
  min_team_rows: 90
  min_matches: 45
  min_zone_coverage: 0.80
  features: [inside_box, outside_box, shots_on_target, blocked]

penalty:
  # Fixed historical penalty conversion prior. Penalties are removed from
  # open-play counts and added back at this value.
  xg: 0.76
  missed_on_target: true
  source: "fixed historical penalty conversion prior; see docs/xg.md"

interval:
  level: 0.80
  draws: 10000
  bootstrap_draws: 2000
  seed: 20261022
  z: 1.2816

goals_range:
  level: 0.80
  method: binomial_penalty
  max_support: 5000
  max_dispersion: 3.0

transfer_check:
  season: 2025-26
  competition_id: sco:premiership
  source: api_football

evaluation:
  method: leave_one_match_out
  validation_season: 2026-27
  max_abs_bias: 0.15
  max_mae: 0.55
  calibration_slope_min: 0.70
  calibration_slope_max: 1.30

provider_estimate:
  # A calibrated provider-style estimate for league rows where the provider did
  # not supply xG. It is not provider xG: the provider uses shot locations that
  # this record does not carry. Fit only on the provider rows supplied for the
  # configured season and league.
  method: ols
  season: 2026-27
  competition_id: sco:premiership
  comparison_person_id: stephen-robinson
  min_team_rows: 60
  clamp_min: 0.0

publication:
  # When the gate fails, publish the same numbers as a descriptive shot
  # expectation, never as an xG substitute.
  fallback_label: shot expectation
  rolling_window: 10
  aggregate_seasons: [2019-20, 2020-21, 2021-22, 2022-23, 2023-24, 2024-25, 2025-26, 2026-27]
