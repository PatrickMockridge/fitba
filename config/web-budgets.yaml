# Browser payload budgets.
#
# These are performance thresholds for files the browser actually fetches, not
# a content cap. A breach is fixed by sharding or lazy-loading; evidence is
# never deleted to fit a budget.
version: 1
reviewed: 2026-11-07
owner: patrickmockridge

pages:
  /manager/: 300000
  /search/: 400000
  /scouting/search/: 350000
  /claims/: 450000
  /glossary/: 500000
  /unknowns/: 300000

json:
  scouting/search/players-*.json: 700000
  # The scouted search group is fetched only on an explicit reader action, not
  # on first paint. The index is sharded rather than trimmed when it outgrows
  # a budget: scouted.json is the small manifest and scouted-*.json holds the
  # entities.
  entities/scouted.json: 200000
  entities/scouted-*.json: 500000

# The same payloads as served by the static export routes.
built_json:
  search/scouted.json: 200000
  search/scouted/*: 500000
  scouting/search/shards/*: 700000
