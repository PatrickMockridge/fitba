# Public correction and change log.
#
# Corrections are factual: a value or label changed against a public source.
# A disagreement with fitba's reading is not a correction and does not enter
# this log. Metric entries point at the narrative in docs/metric-changes.md;
# the narrative remains the normative change-control record.
#
# The log is append-only. Generated web/data/generated/changelog.json is a
# projection of this file and must not be hand-edited.

version: 1
last_reviewed: 2026-10-26
contact_url: https://patrickmockridge.github.io/fitba/about/
note: >
  Report a factual error through the public issue tracker. Include the page,
  the claim and a source. Corrections are recorded with the date, the affected
  page and the status.
append_only: true

entries:
  - id: metric-3.12.0-mls-scouting
    date: 2026-10-27
    kind: metric
    status: published
    title: Major League Soccer added to the scouting universe
    summary: >
      Registry 3.12.0 adds usa:mls to the scouting pool. MLS uses the current
      calendar year, and its Western and Eastern conference tables are retained;
      team rank and PPG percentile are within each conference, while player
      percentiles remain within the full MLS cohort. No cohort rule or ranking
      changed; MLS players are compared within MLS only.
    pages: ["/scouting/", "/scouting/usa-mls/", "/scouting/search/"]
    entities: []
    metric_ids: [scouting.pool, scouting.coverage]
    registry_version: 3.12.0
    doc_anchor: "3-12-0-2026-10-27"
    evidence:
      - {label: "Scouting board", url: "/scouting/"}
      - {label: "MLS league search", url: "/scouting/usa-mls/"}
    fixed_in_dataset: null

  - id: metric-3.11.0-selection-confidence
    date: 2026-10-27
    kind: metric
    status: published
    title: Selection confidence no longer erases at low
    summary: >
      Registry 3.11.0 changes matchday.lineup to v4. A confidence downgrade now
      floors at low, and unknown team news no longer lowers selection
      confidence; unknown means no estimate, not one level below low. Selection
      scores, picks, formation and availability counts are unchanged. The panel
      now shows slots filled and team-news known/unknown counts beside the
      estimate.
    pages: ["/matchday/", "/status/"]
    entities: []
    metric_ids: [matchday.lineup]
    registry_version: 3.11.0
    doc_anchor: "3-11-0-2026-10-27"
    evidence:
      - {label: "Matchday", url: "/matchday/"}
      - {label: "Metrics and audit", url: "/metrics/"}
    fixed_in_dataset: null

  - id: page-2026-10-26-evidence-views
    date: 2026-10-26
    kind: page
    status: published
    title: Unknowns, comparison, depth, sale chain and era lookup
    summary: >
      The unknowns register, guarded comparison panel, ten-family depth chart,
      sale chain and Cormack-era lookup are live. Every view reads published
      records; the cohort exclusion is enforced by player id and no published
      metric value changed. Current-squad comparison is limited to the reviewed
      comparison crosswalk.
    pages: ["/unknowns/", "/scouting/search/", "/squad/", "/former-players/", "/history/", "/glossary/"]
    entities: []
    metric_ids: []
    evidence:
      - {label: "Unknowns register", url: "/unknowns/"}
      - {label: "Scouting search", url: "/scouting/search/"}
    fixed_in_dataset: null

  - id: page-2026-10-26-glossary
    date: 2026-10-26
    kind: page
    status: published
    title: Glossary and definitions published
    summary: >
      Every active registered metric and every curated concept now has one
      definition at /glossary/, with its formula, unit, basis, coverage, source
      layer and registry version. Page provenance links each metric name to its
      entry. No value or definition changed.
    pages: ["/glossary/", "/metrics/", "/search/"]
    entities: []
    metric_ids: []
    evidence:
      - {label: "Glossary", url: "/glossary/"}
    fixed_in_dataset: null

  - id: metric-3.10.0-semantic-layer
    date: 2026-10-26
    kind: metric
    status: published
    title: Search, claims and the reader-first semantic layer
    summary: >
      Registry 3.10.0 adds the canonical entity index and page metadata,
      publishes claims on /claims/ instead of the retired /themes/ route, and
      splits the scouting search payload into meta plus four shards. No
      published value, formula, denominator or source precedence changed; the
      scouting pool and claim counts are the same records.
    pages: ["/search/", "/claims/", "/scouting/search/", "/corrections/"]
    entities: []
    metric_ids: [scouting.pool, scouting.priority, consistency.summary]
    registry_version: 3.10.0
    doc_anchor: "3-10-0-2026-10-26"
    evidence:
      - {label: "Metrics and audit", url: "/metrics/"}
      - {label: "Claims", url: "/claims/"}
    fixed_in_dataset: null

