#   last_seen: 2026-10-21
#   verified_at: 2026-10-21
#   analysis_tags: [wide-forward, left-footed]
#   engagement: null

# Curated, data-backed opinion cards. Each card must cite rumour ids and at
# least one measured comparison (squad need, budget, confirmed business, or a
# coverage-labelled player stat). Opinions are labelled as opinions.
#
# - opinion_id: opinion:2026-27:example
#   title: The links point to a winger; the squad need is central
#   stance: Prefer a central midfielder over another wide forward.
#   body: One or two short paragraphs citing the evidence.
#   evidence: [rum:2026-27:example-player]
#   published: 2026-10-21
opinions: []
