# Transfer completeness gap ledger.
#
# One row per expected move that is not in reference/transfers.yaml. The audit
# is report-only: an open senior gap is shown prominently but never blocks CI.
# Accepted and resolved rows need a reason and a checked_at date. An accepted
# row also removes the player from the audit review queue.
#
# seniority: established | fringe | youth
# status: open | accepted | resolved
# verification_aid: manual_third_party | allowed_source | none
#
# verification_aid is a generic label, not a citation. A third-party page may be
# read as a finding aid, but its URL does not belong here: source_urls may
# contain AFC or Wikipedia only.
