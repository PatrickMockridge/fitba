tactical:
  shape_note: >
    The season spans the Glass and Goodwin regimes. The manager split keeps the
    two segments separate; a single season shape would average across the change.
  style_note: >
    The intended change of style is part of the public record; the measured
    proxies show what actually happened. The page does not equate possession
    with progress.
  selection_note: >
    The lineup backfill is available or partial; selection metrics are measured
    where coverage allows and the fraction is shown.

review:
  what_worked: >
    The club changed manager in February and avoided a relegation fight. The
    European campaign reached the play-off round, one round beyond the previous
    season's third qualifying round.
  what_did_not: >
    The league fell from fourth to tenth, the League Cup ended in the second
    round and the Scottish Cup ended in the fifth. The summer rebuild did not
    produce a settled team.
  trade_off: >
    A change of direction can cost league position before it produces a new
    baseline. The season is evidence of the cost; it is not by itself evidence
    that the direction was wrong.
  read: >
    The Glass experiment is the record's clearest warning against reading a
    single season as a verdict. The club tried to change how it played and where
    it recruited, and the league results fell sharply. The next two seasons test
    whether that was a transition cost or a structural mistake.
  look_ahead: >
    Jim Goodwin would take the club into 2022-23, then be dismissed in January
    with Barry Robson producing a third-place finish.
  label: curated_editorial

