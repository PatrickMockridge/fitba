expectations:
  baseline: >
    A top-six baseline after a fourth-place finish, with evidence that the new
    management could change the style without falling out of the top half.
  target: >
    Top six and a cup run. This is an analyst-set baseline, not a published club
    target.
  context: >
    Stephen Glass was dismissed on 13 February 2022. Barry Robson took one match
    as interim and Jim Goodwin was appointed on 19 February. The club had signed
    a new crop of players in the summer, including Scott Brown as player-coach.
  source_ids: [wikipedia]
  source_urls:
    - https://en.wikipedia.org/wiki/2021%E2%80%9322_Aberdeen_F.C._season

league_context: >
  Aberdeen finished tenth with 41 points, a bottom-six season. The campaign
  produced a change of manager in February and a squad rebuild that did not
  settle. It is the clearest example in the record of the league cost that can
  accompany a change of direction.

