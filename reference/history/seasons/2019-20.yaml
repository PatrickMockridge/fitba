# 2019-20: the transition season.
#
# Dave Cormack was announced during the November 2019 international break and
# formally replaced Stewart Milne on 16 December 2019. The season began under
# the old chairmanship; the review covers the whole season and says so.
season: 2019-20
status: completed
headline: A top-four finish in a season that began before Cormack and ended in a curtailed league.
as_of: null
reviewed_at: '2026-10-21'
manager_stint_ids: [derek-mcinnes-manager-2013]

expectations:
  baseline: >
    A top-four baseline under Derek McInnes, with an expectation of European
    qualification and a meaningful cup run.
  target: >
    Qualify for Europe and reach the latter stages of a cup. This is an
    analyst-set baseline, not a published club target.
  context: >
    The league was curtailed in May 2020 and placings were decided on average
    points per game. The Scottish Cup semi-final was not played until November
    2020. Cormack's chairmanship began in December 2019, so this is a transition
    season rather than a full Cormack-era sample.
  source_ids: [wikipedia]
  source_urls:
    - https://en.wikipedia.org/wiki/2019%E2%80%9320_Aberdeen_F.C._season
    - https://en.wikipedia.org/wiki/Dave_Cormack

league_context: >
  Aberdeen finished fourth on average points per game when the SPFL curtailed
  the season. The campaign began under Stewart Milne and ended under Cormack;
  the manager and the senior core of the squad were unchanged.

cup_runs:
  - competition_id: sco:scottish-cup
    exit_round: Semi-final
    outcome: eliminated
    note: Lost 2-0 to Celtic; the semi-final was played on 1 November 2020 after the league had been curtailed.
    source_ids: [wikipedia]
    source_urls:
      - https://en.wikipedia.org/wiki/2019%E2%80%9320_Aberdeen_F.C._season
  - competition_id: sco:league-cup
    exit_round: Quarter-final
    outcome: eliminated
    note: Lost to Heart of Midlothian on penalties in September 2019.
    source_ids: [wikipedia]
    source_urls:
      - https://en.wikipedia.org/wiki/2019%E2%80%9320_Aberdeen_F.C._season

europe:
