tactical:
  shape_note: >
    The lineup backfill covers every played fixture; the shape mix is measured
    from the kick-off grid. It is descriptive, not a claim about the manager's
    intent.
  style_note: >
    The page does not claim a tactical identity from memory. It shows the
    measured shot, corner, foul and card proxies and labels the reading.
  selection_note: >
    The most-used players and age profile are measured from the historical
    lineups, not inferred from the current squad.

review:
  what_worked: >
    The senior squad held a top-four position through a curtailed league and
    reached the Scottish Cup semi-final and League Cup quarter-final. The
    transition from Milne to Cormack did not produce a mid-season collapse.
  what_did_not: >
    The European campaign ended at the third qualifying round for the sixth year
    in a row, and the Scottish Cup semi-final was lost without a goal. The
    league position was decided by average points per game, not a full season.
  trade_off: >
    Continuity protected the league floor but did not change the European
    ceiling. The first Cormack season is the baseline against which the later
    turnover is measured.
  read: >
    This is the control case: a stable, senior squad under a long-serving
    manager, finishing where the previous seasons had finished. It is not yet
    evidence for or against the trading model. Its value is as a comparison —
    the later seasons show what changed when the squad, the manager and the
    recruitment pattern changed.
  look_ahead: >
    The 2020-21 season would end the McInnes era and begin the most volatile
    managerial sequence of the period.
  label: curated_editorial

