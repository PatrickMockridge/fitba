expectations:
  baseline: >
    A top-four baseline after third place, with a first European group stage
    since 2007-08 and a squad capable of competing on three fronts.
  target: >
    Top four, European group-stage progress and a cup run. This is an
    analyst-set baseline, not a published club target.
  context: >
    Barry Robson was dismissed on 31 January 2024. Peter Leven took the 3
    February match as interim, Neil Warnock was interim from 5 February to 9
    March, and Leven returned as interim until the end of the season.
  source_ids: [wikipedia]
  source_urls:
    - https://en.wikipedia.org/wiki/2023%E2%80%9324_Aberdeen_F.C._season

league_context: >
  Aberdeen finished seventh with 48 points. The season included a European
  group stage and a League Cup final, but the league form did not hold. The
  club used three managers and finished in the bottom half.

