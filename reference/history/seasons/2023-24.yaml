tactical:
  shape_note: >
    The season spans Robson, Warnock and Leven. The manager split is the honest
    unit; a single season shape would average across three regimes.
  style_note: >
    European group-stage football and a cup final are real achievements. The
    measured proxies show whether the league style changed; the reading does
    not treat a cup run as proof that the league model worked.
  selection_note: >
    The lineup backfill is available or partial; selection metrics are measured
    where coverage allows and the fraction is shown.

review:
  what_worked: >
    The club reached a European group stage and a League Cup final, and Fletcher
    Boyd's debut offered a visible youth-pathway moment. The cup run and the
    European campaign gave the season a shape beyond the league table.
  what_did_not: >
    The league fell to seventh, the League Cup final was lost, and the Scottish
    Cup semi-final was lost on penalties. Three managers in one season is a
    stability cost that the cup run does not offset.
  trade_off: >
    A cup final and a European group stage are exactly the kind of variance a
    trading model can produce: they raise revenue and expectation while
    consuming squad depth. The league cost was visible in the same season.
  read: >
    This is the season where the trade-off is hardest to reduce to a verdict.
    The cup final and European group stage were genuine achievements; the
    seventh-place finish and three managers were a genuine cost. The record
    keeps both and refuses to use one to cancel the other.
  look_ahead: >
    The 2024-25 season would bring a new manager, a strong start, a collapse and
    the Scottish Cup — the most extreme swing in the record.
  label: curated_editorial

