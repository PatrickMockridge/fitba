# 2024-25: the Thelin swing and the Scottish Cup.
season: 2024-25
status: completed
headline: A strong start, a long collapse and the Scottish Cup — the most extreme swing in the record.
as_of: null
reviewed_at: '2026-10-21'
manager_stint_ids: [jimmy-thelin-manager-2024]

expectations:
  baseline: >
    A top-four baseline after seventh place, with a new manager and a squad
    rebuild expected to take time. The previous season's cup final and European
    campaign raised the floor of expectation.
  target: >
    Top four and a cup run, with visible progress in style. This is an
    analyst-set baseline, not a published club target.
  context: >
    Jimmy Thelin took charge on 3 June 2024. The season began with a long
    unbeaten run, then produced only five wins in 27 games before the Scottish
    Cup final. Bojan Miovski was sold to Girona for a club-record £6.8 million
    in August 2024.
  source_ids: [wikipedia]
  source_urls:
    - https://en.wikipedia.org/wiki/2024%E2%80%9325_Aberdeen_F.C._season

league_context: >
  Aberdeen finished fifth with 53 points. The season is best read as two
  different campaigns: a strong start and a long second-half collapse. The
  Scottish Cup win is the season's defining achievement and the clearest
  evidence that the same squad could produce a high-level performance.

