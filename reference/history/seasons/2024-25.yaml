tactical:
  shape_note: >
    The season starts with a new manager and a new shape, then changes as the
    results turn. The shape panel keeps the matchday sequence; the reading does
    not infer a single identity from the season aggregate.
  style_note: >
    The strong start and the long collapse are both part of the measured record.
    The page does not use the cup win to explain away the league run, or the
    league run to erase the cup win.
  selection_note: >
    The lineup archive is available from the current career-role backfill for
    2024-25; selection metrics are published where coverage allows.

review:
  what_worked: >
    The Scottish Cup was won, the club sold Miovski for a club-record fee and
    the new manager produced a start that briefly looked like a step change.
    The cup final performance showed the squad could compete with the best team
    in the country.
  what_did_not: >
    The league run after the start was poor: only five wins in 27 games. The
    League Cup semi-final was a 6-0 defeat. The season did not produce a stable
    style or a settled league position.
  trade_off: >
    The cup win and the league collapse are not separate stories. A squad good
    enough to win a final can still be too thin, too young or too inconsistent
    to hold a league season. The trading model's upside and its variance appear
    in the same season.
  read: >
    This is the record's central case. A fan can point to the Scottish Cup as
    proof that the project works, or to five wins in 27 as proof that it does
    not. Both are true descriptions of the same season. The value of the record
    is to keep them together and ask which parts are structural and which are
    variance.
  look_ahead: >
    The 2025-26 season would bring European league-phase football, a cup
    defence and a relegation worry, ending with Thelin's dismissal and Stephen
    Robinson's appointment.
  label: curated_editorial

