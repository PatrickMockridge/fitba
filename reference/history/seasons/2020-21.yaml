tactical:
  shape_note: >
    The season spans two managerial regimes, so a single season shape would hide
    the change. The style panel uses the match-stat proxies; the manager split
    keeps the McInnes and Glass segments separate.
  style_note: >
    The Glass appointment was intended to change the way the team played. The
    measured proxies show whether the change is visible; the reading is kept
    separate.
  selection_note: >
    The lineup backfill is available or partial; selection metrics are measured
    where coverage allows and the fraction is shown.

review:
  what_worked: >
    The league position held at fourth and the club reached the Scottish Cup
    quarter-final. The managerial transition was orderly: one interim match,
    then a permanent appointment.
  what_did_not: >
    The League Cup exit came in the second round and the Scottish Cup run ended
    with a 3-0 defeat at Dundee United. The European campaign again stopped at
    the third qualifying round.
  trade_off: >
    Changing manager while holding a top-four finish protected the league floor
    but delayed the rebuild until the following season. The new manager inherited
    a squad shaped by the previous regime.
  read: >
    This is the hinge season. The results still look like the McInnes era, but
    the appointment of Stephen Glass changed the intended direction. Judging the
    new direction from the final league position alone would miss the point; the
    next season is where the cost of the transition becomes visible.
  look_ahead: >
    Glass would be dismissed in February 2022 after a bottom-six season, and the
    club would move through Robson and Goodwin before the next stable spell.
  label: curated_editorial

