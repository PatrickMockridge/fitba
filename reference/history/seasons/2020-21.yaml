expectations:
  baseline: >
    Another top-four baseline after the curtailed 2019-20 season, with a cup run
    and an attempt to move beyond the Europa League third qualifying round.
  target: >
    Top four and European qualification. This is an analyst-set baseline, not a
    published club target.
  context: >
    The season was played largely without crowds because of COVID-19. Derek
    McInnes left after eight years on 8 March 2021; Paul Sheerin took one match
    as interim and Stephen Glass was appointed on 23 March.
  source_ids: [wikipedia]
  source_urls:
    - https://en.wikipedia.org/wiki/2020%E2%80%9321_Aberdeen_F.C._season

league_context: >
  Aberdeen finished fourth with 56 points. The change of manager in March did
  not change the final position, but it marked the end of the long McInnes
  cycle and the beginning of a new recruitment and style direction.

