  context: >
    Stephen Robinson was appointed on 12 March 2026 and began his first full
    season after a large summer turnover. The League Cup semi-final at Hampden
    was lost 1-0 to Rangers on 31 October 2026. The club parted company with
    Robinson, Brian Kerr and Stephen Craigan on 9 November 2026; Stuart Duff
    took interim charge of first-team training and no permanent replacement had
    been named.
