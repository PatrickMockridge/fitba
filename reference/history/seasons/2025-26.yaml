expectations:
  baseline: >
    A top-four baseline after the Scottish Cup win, with a first European league
    phase in the modern era and a squad expected to defend the cup.
  target: >
    Top four, European progress and a cup defence. This is an analyst-set
    baseline, not a published club target.
  context: >
    Jimmy Thelin was dismissed on 4 January 2026. Peter Leven took interim
    charge, assisted by Craig Hinchliffe, and Stephen Robinson was appointed on
    12 March 2026 after a 67-day search. The club finished ninth with 40 points.
  source_ids: [wikipedia]
