tactical:
  shape_note: >
    The season spans Thelin, Leven and Robinson. The manager split keeps the
    three segments separate; the shape panel shows the matchday sequence and
    does not average across the reset.
  style_note: >
    European football and a relegation fight in the same season are the
    trade-off in its sharpest form. The measured proxies show what happened;
    the reading does not use the European campaign to excuse the league form.
  selection_note: >
    The lineup archive is available from the current career-role backfill for
    2025-26; selection metrics are published where coverage allows.

review:
  what_worked: >
    The club reached a European league phase and defended the Scottish Cup into
    the quarter-finals. The managerial search ended with a permanent appointment
    before the end of the season, giving the next campaign a settled start.
  what_did_not: >
    The league fell to ninth and the club was winless away from home in 2026.
    The cup defence ended in a 3-0 quarter-final defeat at Dunfermline. The
    European league phase produced heavy defeats and a 35th-place finish.
  trade_off: >
    European league-phase football is a reward for the previous season and a
    cost in the next: travel, squad depth and league points. The season shows
    both sides, and the managerial change shows the cost of waiting too long to
    act.
  read: >
    The 2025-26 season is the strongest argument for reading the record as a
    trade-off rather than a verdict. The club was in Europe, defended a trophy
    and still fell into a relegation worry. The reset to Stephen Robinson is the
    response; the 2026-27 season is the test of whether it changes the pattern.
  look_ahead: >
    Stephen Robinson's first full season would begin with a substantial squad
    rebuild, no European football and a League Cup semi-final against Rangers.
  label: curated_editorial

