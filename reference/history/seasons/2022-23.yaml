review:
  what_worked: >
    The January change produced a third-place finish and European qualification.
    The club also realised significant value on Calvin Ramsay and Lewis Ferguson
    in the same season.
  what_did_not: >
    The Scottish Cup exit at Darvel was a genuine shock, and the League Cup
    semi-final was lost after extra time. The league recovery did not remove the
    cup vulnerability.
  trade_off: >
    Selling two young assets and still finishing third is the strongest single
    piece of evidence for the trading model's sporting upside. It does not show
    that the model reliably produces third place; the next season fell to
    seventh.
  read: >
    This season is the model's best case: a mid-season reset, a young squad
    improving, a third-place finish and two significant sales. The cup shock is
    the counterweight. The record should hold both: the trading model can
    coexist with a strong league season, and it can still produce a one-off
    humiliation.
  look_ahead: >
    The 2023-24 season would bring European group-stage football, a League Cup
    final and a seventh-place league finish, with three managers.
  label: curated_editorial

