    stints:
      - stint_id: stewart-milne-chair-1998
        role: Chairman
        role_group: chair
        start: '1998'
        start_precision: year
        end: '2019-12-16'
        end_precision: day
        interim: false
        reason_out: resigned
        source_ids: [wikipedia, afc_news]
        source_urls:
          - https://en.wikipedia.org/wiki/Stewart_Milne
          - https://www.afc.co.uk/en/news/stewart-milne-steps-down-from-aberdeen-fc-board-after-32-years
        verified_at: '2026-10-21'
        notes: Chairman from 1998 until Dave Cormack formally replaced him on 16 December 2019.
