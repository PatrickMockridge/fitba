# Aberdeen staff and board stints for the historical record.
#
# Key named football-operations and board roles only; this is not a full staff
# directory. Dates are kept at the precision the source supports. A null end is
# a current role. Every stint carries at least one allowed public source.
#
# role_group is the closed enum from config/history.yaml. role is the display
# label. Interim spells are separate stints; they keep their own manager record.

people:
