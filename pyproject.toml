[project]
name = "fitba"
version = "0.1.0"
description = "Scottish football data platform, Aberdeen-first"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
  "duckdb>=1.1",
  "httpx>=0.27",
  "orjson>=3.10",
  "pyarrow>=17.0",
  "polars>=1.10",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "tenacity>=9.0",
  "typer>=0.12",
  "beautifulsoup4>=4.15.0",
  "python-dotenv>=1.2.4",
  "vadersentiment>=3.3.2",
]

[project.scripts]
fitba = "fitba.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "pyright>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitba"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
