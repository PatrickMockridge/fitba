name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["update-daily", "update-weekly"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Project site: https://<owner>.github.io/fitba/
          NEXT_PUBLIC_BASE_PATH: /fitba
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cd .. && uv sync --frozen
      - run: cd .. && uv run python scripts/check_publication.py
      - run: cd .. && uv run python scripts/check_metrics.py --strict --published-only
      - run: cd .. && uv run python scripts/check_web_contract.py --ci --base-path /fitba
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
