name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: uv run python scripts/check_publication.py
      - run: uv run python scripts/check_names.py
      - run: uv run python scripts/check_transfers.py
      - run: uv run python scripts/check_history.py
      - run: uv run python scripts/check_matchday.py
      - run: uv run python scripts/check_themes.py
      - run: uv run python scripts/check_provenance.py
      - run: uv run python scripts/check_availability.py
      - run: uv run python scripts/check_needs.py
      - run: uv run python scripts/check_rumours.py
      - run: uv run python scripts/check_squad.py
      - run: uv run python scripts/check_roles.py --published-only
      - run: uv run python scripts/check_shapes.py --published-only
      - run: uv run python scripts/check_career_roles.py --published-only
      - run: uv run python scripts/check_player_page.py
      - run: uv run python scripts/check_player_attributes.py
      - run: uv run python scripts/check_docs.py
      - run: uv run python scripts/check_metrics.py --strict
      - run: uv run python scripts/check_metrics.py --strict --against-git origin/main

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cd .. && uv sync --frozen
      - run: cd .. && uv run python scripts/check_web_contract.py --ci
