name: update-daily

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      - name: Ingest current season
        run: uv run fitba ingest --season current

      - name: Build warehouse
        run: uv run fitba build --season all

      - name: Validate
        run: uv run fitba validate --season current --strict

      - name: Publish derived data
        run: uv run fitba publish --season current --profile public

      - name: Check publication policy
        run: uv run python scripts/check_publication.py

      - name: Commit data if changed
        run: |
          if [ -z "$(git status --porcelain web/data/generated)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "fitba-bot"
          git config user.email "fitba-bot@users.noreply.github.com"
          git add web/data/generated
          git commit -m "data: update $(date -u +%F)

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git tag "data-$(date -u +%F)" || true
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep $((attempt * 5))
          done

      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/validation-*.json
          if-no-files-found: ignore
