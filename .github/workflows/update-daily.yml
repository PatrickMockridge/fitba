name: update-daily

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      - name: Ingest current season
        run: uv run fitba ingest --season current

      - name: Ingest League Cup and Scottish Cup
        run: uv run fitba cups

      - name: Restore last-good club fixtures
        uses: actions/cache@v4
        with:
          path: data/normalized/club_fixtures
          key: club-fixtures-${{ github.ref }}-${{ github.run_id }}
          restore-keys: club-fixtures-${{ github.ref }}-

      - name: Restore career role history
        uses: actions/cache@v4
        with:
          path: data/normalized/career
          key: career-roles-${{ github.ref }}-${{ github.run_id }}
          restore-keys: career-roles-${{ github.ref }}-

      - name: Ingest Aberdeen fixtures and cup results
        continue-on-error: true
        run: uv run fitba fixtures --club aberdeen

      - name: Restore matchday snapshot
        uses: actions/cache@v4
        with:
          path: data/normalized/matchday
          key: matchday-${{ github.ref }}-${{ github.run_id }}
          restore-keys: matchday-${{ github.ref }}-

      - name: Restore historical match record
        uses: actions/cache@v4
        with:
          path: data/normalized/history
          key: history-${{ github.ref }}-${{ github.run_id }}
          restore-keys: history-${{ github.ref }}-

      - name: Restore current match detail
        uses: actions/cache@v4
        with:
          path: data/normalized/matches
          key: match-detail-${{ github.ref }}-${{ github.run_id }}
          restore-keys: match-detail-${{ github.ref }}-

      - name: Refresh current-season match detail
        continue-on-error: true
        run: >
          uv run fitba history --backfill --season current
          --stages fixtures,lineups,events,rosters,players,team_stats
          --max-requests 80

      - name: Refresh next-opponent matchday snapshot
        continue-on-error: true
        run: uv run fitba matchday --refresh --max-requests 24

      - name: Ingest Aberdeen transfers and loans
        continue-on-error: true
        run: uv run fitba transfers

      - name: Ingest Aberdeen squad and player stats
        continue-on-error: true
        run: uv run fitba squad

      - name: Refresh availability ledger snapshot
        continue-on-error: true
        run: uv run fitba availability --refresh

      - name: Refresh current Aberdeen career slice (local, no network)
        continue-on-error: true
        run: uv run fitba career refresh

      - name: Ingest Aberdeen news
        continue-on-error: true
        run: uv run fitba news

      - name: Sample AFC Chat Rumour Mill (reference use)
        continue-on-error: true
        run: uv run fitba forum --limit 6

      - name: Build warehouse
        run: uv run fitba build --season all

      - name: Validate
        run: uv run fitba validate --season current --strict

      - name: Publish derived data
        run: uv run fitba publish --season current --profile public --require-validation

      - name: Check publication policy
        run: uv run python scripts/check_publication.py

      - name: Check metric registry, audit and numeric coverage
        run: uv run python scripts/check_metrics.py --strict

      - name: Check transfer register
        run: uv run python scripts/check_transfers.py

      - name: Check club-name capitalisation
        run: uv run python scripts/check_names.py

      - name: Check historical record
        run: uv run python scripts/check_history.py

      - name: Check matchday dashboard
        run: uv run python scripts/check_matchday.py

      - name: Check medium and long-term themes
        run: uv run python scripts/check_themes.py

      - name: Check fxG model and evaluation gate
        run: uv run python scripts/check_xg.py --published

      - name: Check data provenance
        run: uv run python scripts/check_provenance.py

      - name: Check availability
        run: uv run python scripts/check_availability.py

      - name: Check squad needs
        run: uv run python scripts/check_needs.py

      - name: Check rumour and fan-signal policy
        run: uv run python scripts/check_rumours.py

      - name: Check squad and player-link policy
        run: uv run python scripts/check_squad.py
      - name: Check roles and shape coverage
        run: |
          uv run python scripts/check_roles.py
          uv run python scripts/check_shapes.py

      - name: Check career role eligibility
        run: uv run python scripts/check_career_roles.py

      - name: Check player-page contract
        run: uv run python scripts/check_player_page.py

      - name: Check player-attribute provenance
        run: uv run python scripts/check_player_attributes.py

      - name: Commit data if changed
        run: |
          if [ -z "$(git status --porcelain web/data/generated)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "fitba-bot"
          git config user.email "fitba-bot@users.noreply.github.com"
          git add web/data/generated
          git commit -m "data: update $(date -u +%F)

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git tag "data-$(date -u +%F)" || true
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep $((attempt * 5))
          done

      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/validation-*.json
          if-no-files-found: ignore
