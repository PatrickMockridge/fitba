name: update-daily

# Manual only. The scheduled data cadence runs locally from `.env`; GitHub
# Actions has no API-Football key.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen

      - name: Restore last-good club fixtures
        uses: actions/cache@v4
        with:
          path: data/normalized/club_fixtures
          key: club-fixtures-${{ github.ref }}-${{ github.run_id }}
          restore-keys: club-fixtures-${{ github.ref }}-

      - name: Restore career role history
        uses: actions/cache@v4
        with:
          path: data/normalized/career
          key: career-roles-${{ github.ref }}-${{ github.run_id }}
          restore-keys: career-roles-${{ github.ref }}-

      - name: Restore matchday snapshot
        uses: actions/cache@v4
        with:
          path: data/normalized/matchday
          key: matchday-${{ github.ref }}-${{ github.run_id }}
          restore-keys: matchday-${{ github.ref }}-

      - name: Restore historical match record
        uses: actions/cache@v4
        with:
          path: data/normalized/history
          key: history-${{ github.ref }}-${{ github.run_id }}
          restore-keys: history-${{ github.ref }}-

      - name: Restore current match detail
        uses: actions/cache@v4
        with:
          path: data/normalized/matches
          key: match-detail-${{ github.ref }}-${{ github.run_id }}
          restore-keys: match-detail-${{ github.ref }}-

      - name: Run the ordered update
        run: uv run fitba update --mode ci --force-results

      - name: Commit data if changed
        run: |
          if [ -z "$(git status --porcelain web/data/generated)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "fitba-bot"
          git config user.email "fitba-bot@users.noreply.github.com"
          git add web/data/generated
          git commit -m "data: update $(date -u +%F)

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git tag "data-$(date -u +%F)" || true
          for attempt in 1 2 3; do
            git pull --rebase && git push && break
            sleep $((attempt * 5))
          done

      - name: Upload validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/validation-*.json
          if-no-files-found: ignore
